<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan meals, track macros and keep your pantry stocked for the whole household.">
<meta name="theme-color" content="#F6F3EA">
<title>Table Reset</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply this device's appearance before the first paint to avoid a flash.
  try {
    var dev = JSON.parse(localStorage.getItem('mealmacros.device.v1') || '{}');
    document.documentElement.dataset.theme = dev.appearance || 'auto';
  } catch (e) {}
</script>
</head>
<body>
<div id="app"><noscript>Table Reset needs JavaScript turned on.</noscript></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
